<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="pixel-shadow" x="0" y="0" width="150%" height="150%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#2D2721" />
    </filter>
  </defs>

  <!-- 1. 背景底板 (复古像素暖黄) -->
  <rect x="6" y="6" width="116" height="116" rx="20" fill="#FFE66D" stroke="#2D2721" stroke-width="5" />
  
  <!-- 像素装饰角点 -->
  <rect x="14" y="14" width="4" height="4" fill="#2D2721" />
  <rect x="110" y="14" width="4" height="4" fill="#2D2721" />
  <rect x="14" y="110" width="4" height="4" fill="#2D2721" />
  <rect x="110" y="110" width="4" height="4" fill="#2D2721" />

  <!-- 2. MD 文档纸张 (被抓取的文档) -->
  <g filter="url(#pixel-shadow)">
    <!-- 纸张白底 -->
    <path d="M 28 26 L 76 26 L 94 44 L 94 102 L 28 102 Z" fill="#FFFFFF" stroke="#2D2721" stroke-width="4.5" stroke-linejoin="miter" />
    <!-- 折角三角形 -->
    <path d="M 76 26 L 76 44 L 94 44 Z" fill="#E8E4DA" stroke="#2D2721" stroke-width="4.5" stroke-linejoin="miter" />
    
    <!-- 文档上的 "MD" 像素图标标识 -->
    <!-- M -->
    <path d="M 38 52 L 38 72 L 44 72 L 44 62 L 49 67 L 54 62 L 54 72 L 60 72 L 60 52 L 53 52 L 49 57 L 45 52 Z" fill="#2D2721" />
    <!-- 箭头向下 ↓ (Markdown 经典符号) -->
    <path d="M 68 52 L 74 52 L 74 64 L 79 64 L 71 73 L 63 64 L 68 64 Z" fill="#72ECB5" stroke="#2D2721" stroke-width="2" />

    <!-- 纸张底部模拟文本线 -->
    <rect x="38" y="80" width="46" height="4" rx="2" fill="#E8E4DA" />
    <rect x="38" y="88" width="32" height="4" rx="2" fill="#E8E4DA" />
  </g>

  <!-- 3. 抓取的手掌 (Cute Pixel Grabbing Hand / 抓爪) -->
  <!-- 抓握动作：从右上方抓向文档中央 -->
  <g>
    <!-- 手腕/手臂延伸部 -->
    <path d="M 88 12 L 118 42 L 106 54 L 76 24 Z" fill="#FF8B8B" stroke="#2D2721" stroke-width="4.5" />

    <!-- 手掌主体 -->
    <circle cx="78" cy="46" r="16" fill="#FFFDF8" stroke="#2D2721" stroke-width="4.5" />

    <!-- 手指 1 (拇指，紧抓纸张边缘) -->
    <rect x="52" y="34" width="16" height="8" rx="4" fill="#FFFDF8" stroke="#2D2721" stroke-width="4" transform="rotate(-15 60 38)" />
    
    <!-- 手指 2 (食指，强力压扣在文档正面) -->
    <rect x="62" y="44" width="18" height="8" rx="4" fill="#FFFDF8" stroke="#2D2721" stroke-width="4" transform="rotate(30 71 48)" />

    <!-- 手指 3 (中指) -->
    <rect x="68" y="54" width="18" height="8" rx="4" fill="#FFFDF8" stroke="#2D2721" stroke-width="4" transform="rotate(45 77 58)" />

    <!-- 手指 4 (无名指) -->
    <rect x="76" y="62" width="16" height="8" rx="4" fill="#FFFDF8" stroke="#2D2721" stroke-width="4" transform="rotate(60 84 66)" />

    <!-- 手心可爱粉色肉垫 (Cat Paw / Cute Hand Touch) -->
    <ellipse cx="80" cy="46" rx="6" ry="5" fill="#FF8B8B" />
  </g>

  <!-- 4. 抓取动态特效 (Cute Sparks / Lightning 抓下来的力量感) -->
  <!-- 左上闪烁星 -->
  <path d="M 22 22 L 24 16 L 26 22 L 32 24 L 26 26 L 24 32 L 22 26 L 16 24 Z" fill="#72ECB5" stroke="#2D2721" stroke-width="1.5" />
  <!-- 右下速度线 -->
  <path d="M 98 94 L 110 106" stroke="#2D2721" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 104 88 L 116 100" stroke="#2D2721" stroke-width="3.5" stroke-linecap="round" />
</svg>
