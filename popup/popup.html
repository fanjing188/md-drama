<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MD抓吗 - 网页深度剪藏</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="drama-shell">
    
    <!-- 顶部状态栏 -->
    <header class="app-header">
      <div class="brand-cluster">
        <div class="brand-glyph" title="MD抓吗 网页深度剪藏">
          <img src="../icons/icon48.png" width="22" height="22" alt="MD抓吗" style="display:block; border-radius:2px;">
        </div>
        <div class="brand-meta">
          <span class="brand-title">MD抓吗</span>
          <span class="version-pill">v1.3.0</span>
        </div>
      </div>

      <!-- 右上角文字操作按钮 -->
      <div class="header-tools">
        <button id="btnHistory" class="text-tool-btn" title="查看抓取历史记录">历史</button>
        <button id="btnOptions" class="text-tool-btn" title="打开偏好设置">设置</button>
      </div>
    </header>

    <!-- 1. 当前页面基础信息卡片 (目标内容区) -->
    <div id="pageInfoCard" class="page-info-card">
      <div class="page-info-top">
        <span id="pageSiteTag" class="site-tag">🌐 网页</span>
        <span id="pageHost" class="page-host">...</span>
      </div>
      <div id="pageTitlePreview" class="page-title-text" title="当前页面标题">正在获取网页信息...</div>
    </div>

    <!-- 2. 核心操作区 (主操作按钮 + 左右对称辅助工具条) -->
    <div id="actionDock" class="action-dock">
      <button id="btnPrimaryCrawl" class="hero-cta" title="开始全量深度抓取页面内容与图片并排版">
        <div class="cta-inner">
          <div class="cta-main">
            <span class="cta-pixel-icon">⚡</span>
            <span class="cta-text">抓下来</span>
          </div>
          <span class="cta-shortcut">Alt+Shift+S</span>
        </div>
      </button>

      <!-- 底部对称辅助条 (左下角新手向导 + 右下角服务状态) -->
      <div class="action-footer-row">
        <button type="button" id="btnOnboarding" class="footer-pill-btn" title="打开新手配置向导">
          <span class="pill-icon">📖</span>
          <span>新手向导</span>
        </button>

        <div id="obsidianStatusBar" class="api-status-corner hidden" title="点击重新检测 Obsidian 服务状态">
          <span id="apiStatusDot" class="status-dot-pixel checking"></span>
          <span id="apiStatusText" class="api-status-pixel-text">Obsidian服务：检测中</span>
        </div>
      </div>
    </div>

    <!-- 6 节点可爱像素流水线进度板块 (抓取与保存中展示) -->
    <div id="pipelineContainer" class="pipeline-card hidden">
      <div class="pipeline-header">
        <span class="pulse-indicator" id="pipelinePulseIcon">👾</span>
        <span id="pipelineStatusText" class="pipeline-label">正在探测页面结构...</span>
        <span id="pipelinePercent" class="pipeline-num">0%</span>
      </div>
      <div class="pipeline-track">
        <div id="pipelineFill" class="pipeline-bar"></div>
      </div>
      
      <!-- 6个状态演进节点 (探测 -> 滚动 -> 重塑 -> 去噪 -> 排版 -> 归档) -->
      <div class="pipeline-stages">
        <div class="stage-node running" id="stageNode1">
          <div class="node-bullet">1</div>
          <span class="node-name">探测</span>
        </div>
        <div class="stage-node" id="stageNode2">
          <div class="node-bullet">2</div>
          <span class="node-name">滚动</span>
        </div>
        <div class="stage-node" id="stageNode3">
          <div class="node-bullet">3</div>
          <span class="node-name">重塑</span>
        </div>
        <div class="stage-node" id="stageNode4">
          <div class="node-bullet">4</div>
          <span class="node-name">去噪</span>
        </div>
        <div class="stage-node" id="stageNode5">
          <div class="node-bullet">5</div>
          <span class="node-name">排版</span>
        </div>
        <div class="stage-node" id="stageNode6">
          <div class="node-bullet">6</div>
          <span class="node-name">归档</span>
        </div>
      </div>

      <!-- 保存中专属动态特效卡片 (文章长/图片多时提供清晰的保存动态反馈) -->
      <div id="pipelineSavingCard" class="pipeline-saving-card hidden">
        <div class="saving-anim-cluster">
          <div class="saving-icon-bounce">💾</div>
          <div class="saving-dots-pulse">
            <span class="dot-p dot-1"></span>
            <span class="dot-p dot-2"></span>
            <span class="dot-p dot-3"></span>
          </div>
        </div>
        <div class="saving-info-block">
          <div id="savingStatusTitle" class="saving-title-text">正在写入 Obsidian 知识库...</div>
          <div id="savingStatusDetail" class="saving-detail-text">正在并发下载图片与本地化存储，请稍候</div>
        </div>
      </div>
      
      <button id="btnCancelScroll" class="cancel-link">停止滚动并转换现有内容</button>
    </div>

    <!-- 异常状态提示条 -->
    <div id="errorAlert" class="error-strip hidden">
      <span class="error-emoji">⚠️</span>
      <div id="errorMessage" class="error-text"></div>
    </div>

    <!-- 4. 保存成功专属呈现面板 (可爱 Logo + 归档卡片 + 快捷操作) -->
    <div id="successPanel" class="success-card hidden">
      <div class="success-logo-wrap">
        <img src="../icons/icon128.png" class="success-logo-img" alt="MD抓吗">
        <div class="success-sparkle">✨</div>
      </div>

      <div class="success-title">🎉 已成功抓下来并归档！</div>

      <div class="success-meta-card">
        <div class="success-meta-row">
          <span class="meta-label">文档标题:</span>
          <span id="successDocTitle" class="meta-val title-val">...</span>
        </div>
        <div class="success-meta-row">
          <span class="meta-label">保存位置:</span>
          <span id="successDocPath" class="meta-val path-val">03-知识库/网页剪藏/...</span>
        </div>
        <div class="success-meta-row">
          <span class="meta-label">抓取统计:</span>
          <span id="successDocStats" class="meta-val stats-val">📝 0 字 · 🖼️ 0 图</span>
        </div>
      </div>

      <div class="success-actions">
        <button id="btnSuccessCopy" class="btn-success-action" title="复制 Markdown 内容到剪贴板">
          <span>📋 复制 MD</span>
        </button>
        <button id="btnSuccessViewEdit" class="btn-success-action hollow" title="展开源码编辑器进行预览与微调">
          <span>👾 预览/编辑</span>
        </button>
        <button id="btnSuccessNewCrawl" class="btn-success-action primary" title="返回主界面继续抓取">
          <span>⚡ 继续抓取</span>
        </button>
      </div>
    </div>

    <!-- 剪藏结果工作台 (Studio Panel) -->
    <div id="studioPanel" class="studio-card hidden">
      <div class="doc-header-row">
        <input type="text" id="inputDocTitle" class="doc-title-input" placeholder="输入文档标题...">
        <div class="meta-pills">
          <span id="badgeWordCount" class="meta-pill">0 字</span>
          <span id="badgeImgCount" class="meta-pill">0 图</span>
        </div>
      </div>

      <!-- 标签管理条 -->
      <div class="tags-row">
        <div id="tagPillsContainer" class="tag-chips"></div>
        <input type="text" id="inputNewTag" class="tag-add-input" placeholder="+ 标签">
      </div>

      <!-- 视图模式切换与编辑器 -->
      <div class="view-mode-bar">
        <button id="btnTabEdit" class="tab-btn active">Markdown 源码</button>
        <button id="btnTabPreview" class="tab-btn">渲染预览</button>
      </div>

      <div class="code-viewport">
        <textarea id="markdownCode" class="md-editor" spellcheck="false" placeholder="解析生成的 Markdown 内容..."></textarea>
        <div id="markdownPreview" class="md-preview hidden"></div>
      </div>

      <!-- 底部操作按钮栏 -->
      <div class="studio-dock">
        <button id="btnSaveToObsidian" class="btn-vault">
          <span>💾 同步至 Obsidian</span>
        </button>
        <button id="btnCopyMarkdown" class="btn-hollow" title="复制到剪贴板">
          <span>📋 复制 MD</span>
        </button>
      </div>
    </div>

    <!-- 浮动轻量 Toast -->
    <div id="toastFlyout" class="toast-flyout hidden">
      <span id="toastIcon" class="toast-glyph">✓</span>
      <span id="toastText" class="toast-body">已完成</span>
    </div>

    <!-- 历史记录抽屉 (可容纳10+条记录并支持向下滑动) -->
    <div id="historyDrawer" class="logs-drawer hidden">
      <div class="drawer-header">
        <div class="drawer-title">
          <span>📜 抓取历史记录</span>
        </div>
        <div class="drawer-tools">
          <button id="btnClearHistory" class="tool-btn">清空历史</button>
          <button id="btnCloseHistory" class="tool-btn close">&times;</button>
        </div>
      </div>
      <div id="historyListContainer" class="drawer-body history-list">
        <!-- 历史条目动态注入 -->
      </div>
    </div>

  </div>

  <script src="../utils/logger.js"></script>
  <script src="popup.js"></script>
</body>
</html>
